name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Обновили до v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0' # Указываем стабильную версию

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet pygltflib Pillow  # Добавил библиотеки из твоего кода

      - name: Build APK
        run: flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4  # Обновили до v4
        with:
          name: ze-conventor-app
          path: build/apk/*.apk
