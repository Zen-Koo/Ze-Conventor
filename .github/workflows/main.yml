name: Build APK
on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Мы не указываем версию жестко, чтобы он взял последнюю стабильную

      - name: Build APK
        run: |
          # Флаг -y автоматически отвечает "Да" на установку SDK
          flet build apk -y

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ze-conventor-app
          path: build/apk/*.apk
